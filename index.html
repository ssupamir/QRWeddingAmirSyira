<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amir & Syahira | Wedding Photos</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero">
        

        <div class="overlay"></div>

        <div class="hero-content">

            <p class="welcome">WE'RE GETTING MARRIED</p>

            <h1>Amir <span>&</span> Syahira</h1>

            <p class="date">14 November 2026</p>

            <p class="description">
                Thank you for celebrating our special day.
                Share every beautiful moment you've captured with us ❤️
            </p>

            <button id="uploadBtn">📸 Upload Your Photos</button>

            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                multiple
                hidden
            >

        </div>

    </section>

    <section class="upload-section" id="uploadSection">

        <div class="upload-container">

            <p class="section-label">SHARE THE MOMENTS</p>

            <h2>Your Photos</h2>

            <p class="upload-description">
                Select the photos you captured during our wedding
                and share them with us.
            </p>

            <div class="guest-name-container">

                <label for="guestName">
                    Your Name <span>(Optional)</span>
                </label>

                <input
                    type="text"
                    id="guestName"
                    placeholder="e.g. Ahmad"
                    maxlength="50"
                >

            </div>

            <button id="selectPhotosBtn">
                Select Photos
            </button>

            <button
                id="uploadPhotosBtn"
                class="upload-button"
                disabled
            >
                Upload Photos
            </button>

            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp"
                multiple
                hidden
            >

            <div 
                id="photoPreview" 
                class="photo-preview">
            </div>

            <div 
                id="uploadStatus" 
                class="upload-status">
            </div>

        </div>

    </section>

    <script src="js/main.js"></script>

</body>
</html>
